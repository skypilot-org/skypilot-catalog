name: "update-primeintellect-catalog"
on:
  schedule:
    - cron:  '20 */7 * * *'    # Every 7 hours (coprimes with 24)
    # _PULL_FREQUENCY_HOURS in `primeintellect_catalog.py` needs to be updated
    # accordingly, if this is changed.
  workflow_dispatch:

jobs:
  update_primeintellect_catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Clone SkyPilot repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: skypilot-org/skypilot
          path: sky
      - name: Clone Catalog repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: catalogs
          token: ${{ secrets.GH_ACTION_PAT }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.10"
      - name: Install dependencies
        run: |
          uv venv --seed ~/catalogs-venv
          source ~/catalogs-venv/bin/activate
          cd sky
          uv pip install "."

      - name: Run fetch_primeintellect
        id: fetch_catalogs
        run: |
          source ~/catalogs-venv/bin/activate
          versions=$(cat catalogs/.metadata.yml | yq -r '.version_commit | keys[]')
          for version in $versions; do
            commit_hash=$(cat catalogs/.metadata.yml | yq -r ".version_commit.$version")
            cd sky
            if [ "$commit_hash" == "latest" ]; then
              commit_hash=$(git rev-parse origin/master)
            fi
            git checkout $commit_hash
            # The fetcher was added after the v7 pin; versions whose SkyPilot
            # commit predates it keep their existing catalog.
            if [ ! -f sky/catalog/data_fetchers/fetch_primeintellect.py ]; then
              echo "No Prime Intellect fetcher at $commit_hash ($version), skipping."
              cd -
              continue
            fi
            uv pip install "."
            cd -
            mkdir -p catalogs/catalogs/$version
            cd catalogs/catalogs/$version
            # The fetcher writes primeintellect/vms.csv and refuses to write an
            # empty catalog, so a failed or empty API answer leaves the
            # committed file as it was.
            python -m sky.catalog.data_fetchers.fetch_primeintellect --api-key ${PRIMEINTELLECT_API_KEY} || {
              echo "Warning: Prime Intellect fetch failed for $version, keeping the previous catalog."
              git checkout -- primeintellect/vms.csv 2>/dev/null || true
            }
            cd -
          done
        env:
          # Prime Intellect API key with only the "Availability: Read" scope.
          PRIMEINTELLECT_API_KEY: ${{ secrets.PRIMEINTELLECT_API_KEY }}

      - name: Commit catalog
        run: |
          versions=$(cat catalogs/.metadata.yml | yq -r '.version_commit | keys[]' | tr '\n' ', ')
          cd catalogs
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m"[Bot] Update Prime Intellect catalog $versions (scheduled at $(date))" || { echo "No changes to commit" && exit 0; }
          git fetch origin
          git rebase origin/master
          git push
