name: "update-oci-catalog"
on:
  schedule:
    - cron:  '35 */7 * * *'    # Every 7 hours (coprimes with 24)
    # The frequency can be tuned for the trade-off between
    # freshness of the price and github action cost/user downloading
    # overhead of the update.
    # _PULL_FREQUENCY_HOURS in `oci_catalog.py` need to be updated
    # accordingly, if this is changed.
  workflow_dispatch:

# The OCI fetcher reads two public Oracle endpoints (the Cost Estimator
# shape list and the price list API), so unlike the AWS/GCP/Nebius jobs it
# needs no cloud credentials. See sky/catalog/data_fetchers/fetch_oci.py.
jobs:
  update_oci_catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Clone SkyPilot repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: skypilot-org/skypilot
          path: sky
      - name: Clone Catalog repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: catalogs
          token: ${{ secrets.GH_ACTION_PAT }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.10"
      - name: Run fetch_oci
        id: fetch_catalogs
        run: |
          set -e
          uv venv --seed ~/catalogs-venv
          source ~/catalogs-venv/bin/activate
          versions=$(cat catalogs/.metadata.yml | yq -r '.version_commit | keys[]')
          for version in $versions; do
            if [[ "$version" == "v7" ]]; then
              # The v7 pin predates fetch_oci.py; the v7 OCI catalog stays
              # hand-maintained.
              continue
            fi
            commit_hash=$(cat catalogs/.metadata.yml | yq -r ".version_commit.$version")
            cd sky
            if [ "$commit_hash" == "latest" ]; then
              commit_hash=$(git rev-parse origin/master)
            fi
            git checkout $commit_hash
            uv pip install "."
            cd -
            echo "Fetching OCI catalog for version $version, SkyPilot commit hash $commit_hash"
            mkdir -p catalogs/catalogs/$version
            cd catalogs/catalogs/$version
            python -m sky.catalog.data_fetchers.fetch_oci
            cd -
          done

      - name: Commit catalog
        run: |
          versions=$(cat catalogs/.metadata.yml | yq -r '.version_commit | keys[]' | awk '$0 != "v7"' | tr '\n' ', ')
          cd catalogs
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m"[Bot] Update OCI catalog $versions (scheduled at $(date))" || { echo "No changes to commit" && exit 0; }
          git fetch origin
          git rebase origin/master
          git push
